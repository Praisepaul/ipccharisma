<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Contact IPC Charisma Church | Byndoor</title>
  <meta name="description" content="Contact IPC Charisma Church in Byndoor, Karnataka for prayer requests, questions and fellowship.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffd615">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ipc-charisma.css">
</head>
<body class="bg">
  <main class="container py-5">
    <div class="row justify-content-center mb-4">
      <div class="col-md-8 heading-section text-center">
        <span class="subheading">Contact</span>
        <h1 class="mb-3">Get in touch</h1>
        <p>Contact us for prayer requests, questions or to know more about worship and fellowship at IPC Charisma Church.</p>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <form action="" id="submit-form" class="bg-light p-4 p-md-5 contact-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="Name" class="form-control" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="Email" class="form-control" required placeholder="Your email">
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="Phone" class="form-control" placeholder="Your contact number">
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="Subject" class="form-control" placeholder="Prayer request, question, etc.">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea name="Message" id="message" rows="6" class="form-control" placeholder="How can we help?"></textarea>
          </div>
          <div class="form-group mb-0">
            <button type="submit" class="btn btn-primary py-3 px-5">Send Message</button>
          </div>
        </form>
        <div class="text-center mt-4">
          <p class="mb-2">Prefer WhatsApp?</p>
          <a class="btn btn-outline-primary" href="https://wa.me/917019936011" target="_blank" rel="noopener noreferrer">Chat with us on WhatsApp</a>
          <a class="btn btn-outline-primary ml-2" href="https://www.instagram.com/ipccharismachurchbyndoor/" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
      </div>
    </div>
  </main>

  <a class="ipc-whatsapp-float" href="https://wa.me/917019936011" target="_blank" rel="noopener noreferrer" aria-label="Chat with IPC Charisma Church on WhatsApp">
    <span class="icon-whatsapp" aria-hidden="true"></span>
    <span class="ipc-whatsapp-label">WhatsApp</span>
  </a>

  <footer class="text-center py-4">
    <p class="mb-0">&copy; <span id="year"></span> IPC Charisma Church</p>
  </footer>

  <script src="js/jquery.min.js"></script>
  <script>
    $("#submit-form").submit(function (e) {
      e.preventDefault();
      $.ajax({
        url: "https://script.google.com/macros/s/AKfycbzdstok5JJ-4Tni7PRh-r6Il49RdkHeDbEaYHjymF-LspTBV-Yk/exec",
        data: $("#submit-form").serialize(),
        method: "post",
        success: function () {
          alert("Thank you. Your message has been submitted.");
          window.location.href = "index.html";
        },
        error: function () {
          alert("We encountered an error. Please try again or contact us on WhatsApp.");
        }
      });
    });
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
